<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | MediScan-AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-container" style="max-width: 450px; padding: 45px 35px;">
        <div style="font-size: 50px; margin-bottom: 10px; filter: drop-shadow(0 0 8px var(--primary-neon));"></div>
        <h2>تسجيل الدخول</h2>
        <p style="margin-bottom: 30px;">مرحباً بك في المنصة الطبية المتكاملة MediScan-AI</p>

        <form id="loginForm" style="text-align: right; display: grid; gap: 20px;">
            <div>
                <label style="color: var(--primary-neon); font-weight: 500;">البريد الإلكتروني أو اسم المستخدم</label>
                <input type="email" id="email" required placeholder="doctor@example.com">
            </div>
            <div>
                <label style="color: var(--primary-neon); font-weight: 500;">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">دخول آمن للنظام</button>
        </form>

        <p style="margin-top: 30px; font-size: 0.95rem;">
            ليس لديك حساب مسجل؟ <a href="signup.html" style="color: var(--primary-neon); text-decoration: none; font-weight: 700; border-bottom: 1px dashed var(--primary-neon);">إنشاء حساب جديد</a>
        </p>
    </div>

    <script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const formData = new URLSearchParams();
    formData.append('username', email); 
    formData.append('password', password);

    try {
        const response = await fetch('http://127.0.0.1:8000/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded' 
            },
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            
            localStorage.setItem('token', data.access_token)
            localStorage.setItem('access_token', data.access_token); 
            localStorage.setItem('token_type', data.token_type);
            
            try {
                const base64Url = data.access_token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const decodedToken = JSON.parse(jsonPayload);
                
                
                localStorage.setItem('role', decodedToken.role);       
                localStorage.setItem('user_role', decodedToken.role);   
                localStorage.setItem('user_id', decodedToken.user_id);
                
            } catch (jwtError) {
                console.error("فشل فك بيانات التوكن في الفرونت إند:", jwtError);
            }

            alert('تم تسجيل الدخول بنجاح! جاري الانتقال للوحة التحكم...');
            window.location.href = 'dashboard.html';
        } else {
            alert('خطأ في تسجيل الدخول: ' + (data.detail || 'اسم المستخدم أو كلمة المرور غير صحيحة'));
        }

    } catch (error) {
        console.error('Error:', error);
        alert('تعذر الاتصال بالسيرفر، تأكد أن الباكيند يعمل.');
    }
});
    </script>
</body>
</html>
