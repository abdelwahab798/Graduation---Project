<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الطبي الذكي | MediScan-AI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #chatBox {
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message { padding: 12px 18px; border-radius: 15px; max-width: 80%; }
        .bot { align-self: flex-start; background: rgba(0, 229, 255, 0.1); border: 1px solid var(--primary-neon); }
        .user { align-self: flex-end; background: var(--primary-neon); color: #060d1a; font-weight: 500; }
    </style>
</head>
<body>




    <div class="glass-container" style="max-width: 700px;">
        <h1> المساعد الطبي الذكي</h1>
        <p style="margin-bottom: 20px;">اسأل المساعد الطبي أي استفسار، وسيقوم بتحليله فوراً.</p>

        <div id="chatBox">
            <div class="message bot">أهلاً بك! كيف يمكنني مساعدتك طبياً اليوم؟</div>
        </div>

        <div style="display: flex; gap: 10px;">
            <input type="text" id="userInput" placeholder="اكتب سؤالك الطبي هنا...">
            <button class="btn" onclick="sendMessage()" style="padding: 10px 20px;">إرسال</button>
        </div>
    </div>

    

    <script>
        async function sendMessage() {
    const input = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    if (!input.value.trim()) return;

    const userText = input.value.trim();

    chatBox.innerHTML += `<div class="message user">${userText}</div>`;
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    const loadingId = 'loading-' + Date.now();
    chatBox.innerHTML += `<div class="message bot" id="${loadingId}"> جاري تفكير الطبيب المساعد...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const response = await fetch('http://127.0.0.1:8000/api/rag/ask', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ question: userText })
        });

        const data = await response.json();
        const loadingElement = document.getElementById(loadingId);

        if (response.ok) {
            loadingElement.innerHTML = marked.parse(data.answer);
            
        } else {
            loadingElement.innerHTML = `عذراً، حدث خطأ في السيرفر: ${data.detail || 'يرجى المحاولة لاحقاً.'}`;
        }

    } catch (error) {
        console.error("Error connecting to server:", error);
        const loadingElement = document.getElementById(loadingId);
        if (loadingElement) {
            loadingElement.innerHTML = " تعذر الاتصال بالسيرفر، تأكد من تشغيل الـ Backend Server.";
        }
    }
    chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById('userInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
});
    </script>
</body>
</html>
