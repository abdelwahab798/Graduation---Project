<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المساعد الذكي</title>
    <style>
        body { font-family:Arial; background:#f3f3f3; padding:40px; text-align:center; }
        h1 { margin-bottom:20px; }
        .card {
            max-width:700px; margin:auto; background:white;
            padding:30px; border-radius:15px;
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
        }
        textarea {
            width:100%; height:150px; padding:12px; border:1px solid #ccc;
            border-radius:10px; font-size:18px; margin-bottom:20px;
        }
        button {
            width:100%; padding:15px; background:#007bff; color:white;
            border:none; border-radius:10px; font-size:18px; cursor:pointer;
        }
        button:hover { background:#0056b3; }
        .back { margin-top:20px; text-decoration:none; color:#007bff; }
    </style>
</head>
<body>

<h1>المساعد الذكي</h1>

<div class="card">
    <textarea placeholder="اكتب سؤالك هنا..."></textarea>
    <button>إرسال</button>

    <a class="back" href="index.html">⬅ الرجوع للصفحة الرئيسية</a>
</div>

</body>
</html>
