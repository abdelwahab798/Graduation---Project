<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | MediScan-AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>








    <div class="glass-container" style="max-width: 450px; padding: 45px 35px;">
        <div style="font-size: 50px; margin-bottom: 10px; filter: drop-shadow(0 0 8px var(--primary-neon));">🔐</div>
        <h2>تسجيل الدخول</h2>
        <p style="margin-bottom: 30px;">مرحباً بك في المنصة الطبية المتكاملة MediScan-AI</p>

        <form id="loginForm" style="text-align: right; display: grid; gap: 20px;">
            <div>
                <label style="color: var(--primary-neon); font-weight: 500;">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="doctor@example.com">
            </div>
            <div>
                <label style="color: var(--primary-neon); font-weight: 500;">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">دخول آمن للنظام</button>
        </form>

        <p style="margin-top: 30px; font-size: 0.95rem;">
            ليس لديك حساب مسجل؟ <a href="signup.html" style="color: var(--primary-neon); text-decoration: none; font-weight: 700; border-bottom: 1px dashed var(--primary-neon);">إنشاء حساب جديد</a>
        </p>
    </div>

    <script>
        // كود الجافا سكريبت للانتقال التفاعلي بعد الضغط على زر الدخول
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
