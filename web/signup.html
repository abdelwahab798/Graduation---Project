<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | MediScan-AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>








    <div class="glass-container" style="max-width: 480px; padding: 45px 35px;">
        <div style="font-size: 50px; margin-bottom: 10px; filter: drop-shadow(0 0 8px var(--secondary-neon));">🚀</div>
        <h2>إنشاء حساب جديد</h2>
        <p style="margin-bottom: 30px;">انضم إلينا الآن وابدأ في فحص الأشعة بدعم الذكاء الاصطناعي</p>

        <form id="signupForm" style="text-align: right; display: grid; gap: 18px;">
            <div>
                <label style="color: var(--primary-neon); font-weight: 500;">الاسم بالكامل</label>
                <input type="text" id="fullName" required placeholder="أدخل اسمك الثلاثي">
            </div>
            <div>
                <label style="color: var(--primary-neon); font-weight: 500;">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="doctor@example.com">
            </div>
            <div>
                <label style="color: var(--primary-neon); font-weight: 500;">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 10px; background: linear-gradient(135deg, var(--secondary-neon), #00e5ff);">تسجيل الحساب الجديد</button>
        </form>

        <p style="margin-top: 30px; font-size: 0.95rem;">
            تمتلك حساباً بالفعل؟ <a href="login.html" style="color: var(--secondary-neon); text-decoration: none; font-weight: 700; border-bottom: 1px dashed var(--secondary-neon);">تسجيل الدخول</a>
        </p>
    </div>

    <script>
        // كود الجافا سكريبت للتوجيه التلقائي بعد إتمام التسجيل الوهمي
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم إنشاء الحساب بنجاح! سيتم توجيهك الآن للوحة التحكم.');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
