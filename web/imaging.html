<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>رفع الأشعة</title>
    <style>
        body { font-family:Arial; background:#f3f3f3; padding:40px; text-align:center; }
        h1 { margin-bottom:20px; }
        .card { max-width:700px; margin:auto; background:white; padding:30px;
            border-radius:15px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
        .btn {

            background:#ff9800; color:white; font-size:20px;
            text-decoration:none; border-radius:10px; transition:.3s;
        }
        .btn:hover { background:#e68900; }
        .back { margin-top:20px; text-decoration:none; color:#007bff; }
    </style>
</head>
<body>

<h1>رفع الأشعة</h1>

<div class="card">
    <a class="btn" href="#">أشعة التهاب رئوي (X-Ray)</a>
    <a class="btn" href="#">أشعة دماغ (MRI)</a>
    <a class="btn" href="#">أشعة صدر (CT)</a>

    <a class="back" href="index.html">⬅ الرجوع للصفحة الرئيسية</a>
</div>

</body>
</html>
